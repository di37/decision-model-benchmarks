services:
  clef-flash:
    build: .
    image: local/clef-flash:0.1
    container_name: bench-clef-flash
    restart: "no"
    entrypoint:
      - uvicorn
    command:
      - server:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:8710:8000"
    volumes:
      - ../../../models/weights/clef-flash:/models/clef-flash:ro
      - ./server.py:/app/server.py:ro
    working_dir: /app
    environment:
      CLEF_MODEL_PATH: /models/clef-flash
      CLEF_DEVICE: cuda
      HF_HUB_OFFLINE: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${BENCH_GPU:-1}"]
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=4)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
